name: E2E Test

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaget
          POSTGRES_PASSWORD: kaget
          POSTGRES_DB: kaget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaget -d kaget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      API_PORT: "3000"
      DATABASE_URL: postgresql://kaget:kaget@localhost:5432/kaget
      BETTER_AUTH_SECRET: ci-e2e-secret-with-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:3000
      VITE_APP_URL: http://localhost:5173
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate database
        run: bun run --filter @kaget/api db:migrate

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Generate route types
        run: bun run gen:routes --filter @kaget/web

      - name: Start API server
        run: |
          bun run --filter @kaget/api dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/auth/get-session > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Run Playwright tests
        working-directory: apps/web
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
